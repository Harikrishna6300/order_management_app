name: CI

on:
push:
branches:
- develop
- main
pull_request:

jobs:
server:
runs-on: ubuntu-latest

```
services:
  mariadb:
    image: mariadb:10.6
    env:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - 3306:3306
    options: >-
      --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
      --health-interval=10s
      --health-timeout=5s
      --health-retries=3

  redis-cache:
    image: redis:alpine
    ports:
      - 6379:6379

  redis-queue:
    image: redis:alpine
    ports:
      - 6380:6379

  redis-socketio:
    image: redis:alpine
    ports:
      - 6381:6379

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v4
    with:
      python-version: "3.12"

  - name: Install Dependencies
    run: |
      sudo apt update
      sudo apt install -y \
        mariadb-client \
        libmysqlclient-dev \
        build-essential \
        redis-tools \
        xvfb \
        libfontconfig

  - name: Install Bench
    run: |
      pip install frappe-bench

  - name: Initialize Bench
    run: |
      bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" frappe-bench

  - name: Setup Bench Environment
    run: |
      cd frappe-bench
      bench get-app order_management_app $GITHUB_WORKSPACE
      bench new-site test_site \
        --db-root-password root \
        --admin-password admin \
        --mariadb-root-password root \
        --no-mariadb-socket
      bench --site test_site install-app order_management_app

  - name: Run Tests
    run: |
      cd frappe-bench
      bench --site test_site run-tests --app order_management_app
```
